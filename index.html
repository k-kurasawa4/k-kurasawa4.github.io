<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>公開用リポジトリ</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    h1{
      text-align: center;
      margin-bottom: 30px;
    }
    .item-wrapper{
      display: flex;
    }
    li{
      margin: 0 auto;
      list-style: none;
    }
      .btn-outline-blue {
  padding: 12px 28px;
  background: transparent;
  color: #3b82f6;
  border: 2px solid #3b82f6;
  border-radius: 8px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  >a{
    text-decoration: none;
  }
}
.btn-outline-blue:hover {
  background: #3b82f6;
  color: #ffffff;
}

  </style>
</head>
<body>
  <h1>公開用リポジトリ</h1>
  <div class="item-wrapper">
  <li class="btn-outline-blue">
  <a href="columns/" target="_blank">columnsを使ったカラムレイアウト</a>
</li>
<li class="btn-outline-blue">
  <a href="donut-shop/" target="_blank">felica Bread&Salad|トップページ</a>
</li>
<li class="btn-outline-blue">
  <a href="lightbox/" target="_blank">Lighboxの実装</a>
  </li>
  </div>
</body>
</html>
