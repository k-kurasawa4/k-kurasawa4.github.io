<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gridを使ったレイアウト</title>
  <style>
    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    /* gridを使ったレイアウト */
    .grid-wrapper{
      max-width: 800px;
      aspect-ratio: 2/1;
      background-color: #413f3f;
      margin: 100px auto;
      display: grid;
      gap: 10px;
      >p{
        background-color: #d47911;
        &:nth-of-type(1){
          grid-column: 1/4;
          grid-row: 1/3;
        }
        &:nth-of-type(2){
          grid-column: 4/5;
          grid-row: 1/2;
          background-color: #d47911;
        }
        &:nth-of-type(3){
          grid-column: 5/7;
          grid-row: 1/2;
          background-color: #d47911;
        }
        &:nth-of-type(4){
          grid-column: 4/6;
          grid-row: 2/3;
          background-color: #d47911;
        }
        &:nth-of-type(5){
          grid-column: 6/7;
          grid-row: 2/3;
          background-color: #d47911;
        }
        &:nth-of-type(6){
          grid-column: 1/5;
          grid-row: 3/4;
          background-color: #d47911;
        }
        &:nth-of-type(7){
          grid-column: 5/7;
          grid-row: 3/4;
          background-color: #d47911;
        }

      }
    }
  </style>
</head>
<body>
  <div class="grid-wrapper">
    <p>1</p>
    <p>2</p>
    <p>3</p>
    <p>4</p>
    <p>5</p>
    <p>6</p>
    <p>7</p>
  </div>
  
</body>
</html>
