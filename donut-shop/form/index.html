<script>
  //$(document).readyの略
  $(function(){

//西暦を取得して表示
const fullYear = new Date().getFullYear();
/* const fullYear = 2027; */

if(fullYear >= 2027){
  $('this-year').text('2026- '+fullYear);
}else{
$('#this-year').text(fullYear)
}

//hamburgerbutton
//#ham-btnをon.clickしたら
$('#ham-btn').on('click',function(){
$(this).toggleClass('is-active');
$('#sp-nav').slideToggle(200);
});


//#sp-nav aをon.clickしたら
$('#sp-nav a').on('click',function(){
$('#sp-nav').slideUp(200);
$('#ham-btn').removeClass('is-active');
});


//ajaxを使用したリダイレクト
$('#g-form').submit(function (event) {
const formData = $('#g-form').serialize();
$.ajax({
  url: "https://docs.google.com/forms/u/0/d/e/1FAIpQLScYm-xryZfDM6AVY-cZhNqL77nvi6yPx4g7S_RjKIqWAjFPrA/formResponse",
  data: formData,
  type: "POST",
  dataType: "xml",
  statusCode: {
    0: function(){
      window.location.href = "thanks.html";
      },
    200: function(){
     //失敗したときの処理
      }
    }
  });
//googleformへのページ遷移をキャンセル
event.preventDefault();
});

});

</script>
